# Drivvo CSV headers (design D7, spec "Drivvo import").
#
# PROVISIONAL: English header names are a best guess and were NOT taken from
# a real Drivvo export. Finalise against the user's real export (open
# question O1, tasks 4.3-4.4), then remove this mark and set provisional to
# false. Further languages are added as extra aliases in the lists below.

[meta]
provisional = true

# Refuelling rows.
[refuel]
date = ["Date"]
odometer = ["Odometer", "Odometer (km)", "Odo"]
litres = ["Volume", "Liters", "Litres", "Quantity", "Fuel quantity"]
price_per_litre = ["Price per unit", "Price/L", "Unit price", "Price per liter"]
total = ["Total cost", "Total price", "Total", "Total value"]
full = ["Full tank", "Full"]
missed = ["Missed refuelling", "Missed refueling", "Skipped"]
station = ["Gas station", "Station", "Fuel station", "Place"]
notes = ["Notes", "Note"]

# Service rows.
[service]
date = ["Date"]
odometer = ["Odometer", "Odometer (km)", "Odo"]
title = ["Service", "Service type"]
amount = ["Total cost", "Total price", "Total", "Cost"]
notes = ["Notes", "Note"]

# Expense rows.
[expense]
date = ["Date"]
odometer = ["Odometer", "Odometer (km)", "Odo"]
title = ["Expense", "Expense type", "Type"]
amount = ["Total cost", "Total price", "Total", "Cost"]
notes = ["Notes", "Note"]

# Drivvo service or expense type -> our category. Services default to
# maintenance, expenses to other; the original type is kept as the title.
[categories]
maintenance = ["Oil change", "Service", "Maintenance", "Repair", "Brakes", "Tyres", "Tires", "Battery"]
insurance = ["Insurance"]
registration = ["Registration", "Vehicle tax", "Road tax", "Inspection"]
