# Drivvo CSV, refuelling rows.
# Source: converted from the earlier built-in mapping [refuel]. BEST EFFORT, UNTESTED:
# the English header names are a guess and were not taken from a real Drivvo
# export. Fix the mapping in the editor and save it as your own preset.

name = "Drivvo (refuelling)"
note = "Best effort, untested: not checked against a real export."
verified = false
export = false

[format]
date_format = "auto"
decimal_char = "auto"
group_char = ""
distance_unit = "km"
volume_unit = "l"

[fields]
type = { value = "refuel" }
date = { column = "Date" }
odometer_km = { column = ["Odometer", "Odo"] }
fuel_l = { column = ["Volume", "Liters", "Litres", "Quantity", "Fuel quantity"] }
price_per_l = { column = ["Price per unit", "Price/L", "Unit price", "Price per liter"] }
total = { column = ["Total cost", "Total price", "Total", "Total value"] }
full = { column = ["Full tank", "Full"], true_values = ["Yes", "Y", "True", "1"], false_values = ["No", "N", "False", "0"], default = "true" }
missed_previous = { column = ["Missed refuelling", "Missed refueling", "Skipped"], true_values = ["Yes", "Y", "True", "1"], false_values = ["No", "N", "False", "0"] }
station = { column = ["Gas station", "Station", "Fuel station", "Place"] }
notes = { column = ["Notes", "Note"] }
