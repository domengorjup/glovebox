# Export: Fuelio (Android) CSV backup file, "## Log" section (fill-ups). The
# exact menu path in Fuelio was not checked.
# NEVER TESTED against a real export: the layout was reverse-engineered from
# open-source parsers. Units are read from the headers ("Odo (km)",
# "Fuel (litres)"). Fuelio writes 0 for a price that was not given. Station
# names from "## FavStations" and the vehicle name from "## Vehicle" are not
# used (design D9); the vehicle is chosen at import (a ZIP member's name is
# proposed). Then use "Import next section" (Fuelio (costs)) for the costs.

name = "Fuelio (fill-ups)"
note = "Never tested against a real export (based on open-source parsers). Fuelio CSV backup, ## Log section. Then use 'Import next section' for the costs."
verified = false
export = false

[file]
section = "Log"

[format]
date_format = "auto"
decimal_char = "auto"
group_char = ""
distance_unit = "auto"
volume_unit = "auto"

[fields]
type = { value = "refuel" }
date = { column = ["Data", "Date"] }
odometer_km = { column = "Odo" }
fuel_l = { column = "Fuel" }
total = { column = ["Price (optional)", "Price"], missing_values = ["0", "0.0", "0.00", "0,0", "0,00"] }
price_per_l = { column = "VolumePrice", missing_values = ["0", "0.0", "0.00", "0.000", "0,0", "0,00", "0,000"] }
full = { column = "Full", true_values = ["1"], false_values = ["0"], default = "true" }
missed_previous = { column = "Missed", true_values = ["1"], false_values = ["0"] }
station = { column = ["City (optional)", "City"] }
notes = { column = ["Notes (optional)", "Notes"] }
source_ref = { column = "UniqueId" }
