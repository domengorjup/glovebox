# Fuelio backup, "## Log" section (fill-ups).
# Source: converted from the earlier built-in mapping [log] and its rules. The
# format was reverse-engineered from open-source parsers, not checked against
# a real export. Units are read from the headers ("Odo (km)", "Fuel (litres)").
# Fuelio writes 0 for a price that was not given. Not used any more (design
# D9): station names from "## FavStations", the vehicle name from
# "## Vehicle". The vehicle is chosen at import (a ZIP member's name is proposed).

name = "Fuelio (fill-ups)"
note = "Fuelio backup, ## Log section. Import the same file again with 'Fuelio (costs)' for the costs. Based on open-source parsers."
verified = false
export = false

[file]
section = "Log"

[format]
date_format = "auto"
decimal_char = "auto"
group_char = ""
distance_unit = "auto"
volume_unit = "auto"

[fields]
type = { value = "refuel" }
date = { column = ["Data", "Date"] }
odometer_km = { column = "Odo" }
fuel_l = { column = "Fuel" }
total = { column = ["Price (optional)", "Price"], missing_values = ["0", "0.0", "0.00", "0,0", "0,00"] }
price_per_l = { column = "VolumePrice", missing_values = ["0", "0.0", "0.00", "0.000", "0,0", "0,00", "0,000"] }
full = { column = "Full", true_values = ["1"], false_values = ["0"], default = "true" }
missed_previous = { column = "Missed", true_values = ["1"], false_values = ["0"] }
station = { column = ["City (optional)", "City"] }
notes = { column = ["Notes (optional)", "Notes"] }
source_ref = { column = "UniqueId" }
