# Export: Drivvo Android app → History, with one vehicle selected → export
# CSV. One file per vehicle, no vehicle column: choose the vehicle at import.
# Tested with real Drivvo Android exports, October 2026 ("##Service" section).
# Reached from "Import next section", or by uploading the same file again.
# Drivvo writes one row per service item, so a visit becomes several
# maintenance expenses on the same date, each titled with its type of service.
# Items with a total cost of 0 (listed without a price) are not expenses: with
# zero_amount = "note" their names are added to the note of the first priced
# item of the same visit (same date and odometer) as "Also: Oil filter, ...".
# A free item without a priced one in its visit is skipped and counted.
# "Service location", "Title", "Discount" and the instalment columns are not
# imported.
# The Drivvo web export (History or vehicle menu → Export → CSV) holds the
# same records and values (checked), so no separate preset is shipped: use
# the phone export. The web file adds a "Vehicle Name" column and a
# "#Vehicle" section, which bring nothing for a one-vehicle file; its
# "#Refueling" section has other headers ("Price / gal", "Gas station") and
# is not covered.

name = "Drivvo (services)"
note = "Tested with Drivvo Android exports, October 2026. One maintenance expense per priced service item."
steps = [
  "Zero-cost items become notes on the visit.",
  "Import now.",
]
zero_amount = "note"
verified = true
export = false

[file]
section = "Service"

[format]
date_format = "auto"
decimal_char = "."
group_char = ""
distance_unit = "auto"
volume_unit = "l"

[fields]
type = { value = "expense" }
date = { column = "Date" }
odometer_km = { column = "Odometer", missing_values = ["0", "0.0"] }
title = { column = "Type of service" }
category = { value = "maintenance" }
total = { column = "Total cost" }
notes = { column = "Notes" }
