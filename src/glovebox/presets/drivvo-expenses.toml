# Export: Drivvo Android app → History, with one vehicle selected → export
# CSV. One file per vehicle, no vehicle column: choose the vehicle at import.
# Tested with real Drivvo Android exports, October 2026 ("##Expense" section).
# Reached from "Import next section" after the refuelling section, or by
# uploading the same file again. The
# type of expense is kept as the title and mapped to a category; types the
# map does not know (including your own custom types) become "other": add
# them to the map and save your own preset. "Expense location", "Title",
# "Discount" and the instalment columns are not imported.
# The Drivvo web export (History or vehicle menu → Export → CSV) holds the
# same records and values (checked), so no separate preset is shipped: use
# the phone export. The web file adds a "Vehicle Name" column and a
# "#Vehicle" section, which bring nothing for a one-vehicle file; its
# "#Refueling" section has other headers ("Price / gal", "Gas station") and
# is not covered.

name = "Drivvo (expenses)"
note = "Tested with Drivvo Android exports, October 2026. Unknown expense types become 'other'."
steps = [
  "Your own types: Adjust mapping → Categories.",
  "E.g. your insurance type → Insurance.",
  "Save as your own preset to reuse.",
]
verified = true
export = false

[file]
section = "Expense"

[format]
date_format = "auto"
decimal_char = "."
group_char = ""
distance_unit = "auto"
volume_unit = "l"

[fields]
type = { value = "expense" }
date = { column = "Date" }
odometer_km = { column = "Odometer", missing_values = ["0", "0.0"] }
title = { column = "Type of expense" }
category = { column = "Type of expense", default = "other", map = { insurance = ["Insurance"], registration = ["Registration", "Licensing", "Vehicle tax", "Road tax"], maintenance = ["Repair", "Tires", "Tyres"] } }
total = { column = "Total cost" }
notes = { column = "Notes" }

[[skip_rows]]
column = "Total cost"
values = ["0", "0.0", "0.00"]
