# Export: a CSV in Fuelly's import format with litres and kilometres, as
# accepted by Fuelly's CSV import on the website (one file per vehicle). This
# is also the layout Glovebox writes when you export with this preset.
# NEVER TESTED against a real Fuelly file: based on public descriptions of the
# format. The file has no vehicle column: the file name (or ZIP member) names
# the vehicle.

name = "Fuelly (metric)"
note = "Never tested against a real export (based on public descriptions). Fuelly import-format CSV with litres."
verified = false
export = true
split_by_vehicle = true

[format]
date_format = "auto"
decimal_char = "auto"
group_char = ""
distance_unit = "km"
volume_unit = "l"

[fields]
type = { value = "refuel" }
date = { column = "fuelup_date" }
odometer_km = { column = ["odometer", "km"] }
fuel_l = { column = ["litres", "liters"] }
price_per_l = { column = "price" }
full = { column = "partial_fuelup", true_values = ["0"], false_values = ["1"] }
missed_previous = { column = "missed_fuelup", true_values = ["1"], false_values = ["0"] }
notes = { column = "notes" }
station = { column = "tags" }
