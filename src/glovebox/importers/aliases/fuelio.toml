# Fuelio backup headers (design D7). Odometer and fuel headers carry units
# and are matched by pattern in fuelio.py, not listed here.
# Unverified: reverse-engineered from two open-source parsers, not from a
# real export.

[log]
date = ["Data", "Date"]
full = ["Full"]
missed = ["Missed"]
total = ["Price (optional)", "Price"]
price_per_litre = ["VolumePrice"]
city = ["City (optional)", "City"]
station_id = ["StationID (optional)", "StationID"]
notes = ["Notes (optional)", "Notes"]
unique_id = ["UniqueId"]

[vehicle]
name = ["Name"]

[fav_stations]
station_id = ["StationID"]
name_brand = ["NameBrand"]

[cost_categories]
type_id = ["CostTypeID"]
name = ["Name"]

[costs]
title = ["CostTitle"]
date = ["Date"]
odometer = ["Odo"]
type_id = ["CostTypeID"]
notes = ["Notes"]
cost = ["Cost"]
is_template = ["isTemplate"]
is_income = ["isIncome"]

# Fuelio category name -> our category. Anything else becomes "other".
[categories]
maintenance = ["Service", "Maintenance", "Repair", "Service/Maintenance"]
insurance = ["Insurance"]
registration = ["Registration", "Road tax", "Vehicle tax"]
