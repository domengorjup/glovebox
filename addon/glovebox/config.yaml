name: Glovebox
version: "0.1.1"
slug: glovebox
description: "Track car running costs: refuelling, maintenance and insurance, with statistics."
url: https://github.com/domengorjup/glovebox
arch:
  - amd64
  - aarch64
ingress: true
ingress_port: 8099
panel_icon: mdi:car-wrench
panel_title: Glovebox
panel_admin: true
# Optional stats API (Bearer token, /api/v1 only). Host port null = off until the
# user sets it in the add-on network settings; it also needs the api_token option.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: "Stats API (/api/v1) with Bearer token; needs the api_token option"
# The Dockerfile is a plain image (no s6 overlay); keep the Docker-provided init.
init: true
boot: auto
startup: application
backup: hot
# No `image:` key yet: the Supervisor builds this folder locally on the HA host.
# Group 10 (CI) adds `image: ghcr.io/<owner>/glovebox`.
options:
  currency: EUR
schema:
  currency: "match(^[A-Za-z]{3}$)"
  api_token: "password?"
