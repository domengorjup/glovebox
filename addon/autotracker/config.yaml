name: Autotracker
version: "0.1.0"
slug: autotracker
description: Track car running costs: refuelling, maintenance and insurance, with statistics.
url: https://github.com/CHANGE_ME/autotracker_app
arch:
  - amd64
  - aarch64
ingress: true
ingress_port: 8099
panel_icon: mdi:car
panel_title: Autotracker
panel_admin: true
# The Dockerfile is a plain image (no s6 overlay); keep the Docker-provided init.
init: true
boot: auto
startup: application
backup: hot
# No `image:` key yet: the Supervisor builds this folder locally on the HA host.
# Group 10 (CI) adds `image: ghcr.io/<owner>/autotracker`.
options:
  currency: EUR
schema:
  currency: "match(^[A-Za-z]{3}$)"
  api_token: "password?"
